:root{--navy:#12294a;--navy2:#0b1a33;--teal:#1d7f93;--gold:#f2a93b;--cream:#fff7e6;--red:#e8505b;--green:#37b36b;--blue:#3d7ee0;--purple:#8a5cd6}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Nunito,system-ui,sans-serif;font-weight:600;color:#fff;background:radial-gradient(ellipse at top,#1d3f73 0%,var(--navy) 45%,var(--navy2) 100%);min-height:100vh;overflow-x:hidden}
h1,h2,h3,.fred{font-family:Fredoka,Nunito,sans-serif;font-weight:700}
.stars{position:fixed;inset:0;pointer-events:none;z-index:0}
.stars i{position:absolute;width:3px;height:3px;background:#fff;border-radius:50%;animation:tw 3s infinite ease-in-out}
@keyframes tw{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:1;transform:scale(1.4)}}
main{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:18px 16px 60px}
.screen{display:none;animation:pop .35s ease}.screen.on{display:block}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.hero{text-align:center;padding-top:6px}
.hero img{width:100%;max-width:420px;border-radius:22px;border:4px solid var(--gold);box-shadow:0 10px 30px #0008}
h1{font-size:clamp(2rem,8vw,3rem);color:var(--gold);margin:14px 0 4px;text-shadow:0 3px 0 #0006}
.sub{opacity:.9;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:10px}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
.tile{border:0;border-radius:20px;padding:14px 10px;color:#fff;cursor:pointer;text-align:center;font-family:Fredoka;font-size:1.02rem;font-weight:600;box-shadow:0 6px 0 #0005;transition:transform .12s;min-height:104px;position:relative}
.tile:active{transform:translateY(4px);box-shadow:0 2px 0 #0005}
.tile .em{font-size:2rem;display:block}
.tile .nm{display:block;margin-top:2px;line-height:1.15}
.tile .bd{position:absolute;top:6px;right:8px;font-size:1.2rem}
.c0{background:linear-gradient(#e8505b,#c63b47)}.c1{background:linear-gradient(#f2a93b,#d98c17)}.c2{background:linear-gradient(#37b36b,#238a4e)}.c3{background:linear-gradient(#3d7ee0,#2a5fb8)}.c4{background:linear-gradient(#8a5cd6,#6a3fb5)}.c5{background:linear-gradient(#1d9fb5,#13788a)}.c6{background:linear-gradient(#ee7aa5,#cc5585)}.c7{background:linear-gradient(#7bc043,#5a9a2a)}.c8{background:linear-gradient(#ff8a3d,#d96a1f)}.c9{background:linear-gradient(#5b6ee1,#4151bd)}
.big{display:block;width:100%;margin-top:14px;padding:16px;border:0;border-radius:18px;font-family:Fredoka;font-size:1.25rem;font-weight:700;color:var(--navy);background:linear-gradient(#ffd27a,var(--gold));box-shadow:0 6px 0 #a96b0e;cursor:pointer}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 #a96b0e}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.back{border:0;background:#ffffff22;color:#fff;border-radius:12px;padding:8px 12px;font-family:Fredoka;font-size:1rem;cursor:pointer}
.bar{flex:1;height:16px;background:#ffffff26;border-radius:10px;overflow:hidden}
.bar b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),#ffe08a);border-radius:10px;transition:width .4s}
.sc{font-family:Fredoka;color:var(--gold);min-width:64px;text-align:right}
.card{background:#fff;color:var(--navy);border-radius:24px;padding:20px 18px;box-shadow:0 10px 30px #0006}
.rn{font-family:Fredoka;color:var(--teal);font-size:.95rem}
.qt{font-family:Fredoka;font-size:clamp(1.2rem,5vw,1.6rem);line-height:1.25;margin:6px 0 14px}
.opts{display:grid;gap:10px}
.opt{border:0;border-radius:16px;padding:14px 14px;text-align:left;font-family:Nunito;font-weight:700;font-size:1.05rem;color:#fff;cursor:pointer;box-shadow:0 5px 0 #0004;display:flex;gap:10px;align-items:center}
.opt:active{transform:translateY(3px);box-shadow:0 2px 0 #0004}
.opt .l{background:#ffffff40;border-radius:50%;width:30px;height:30px;display:grid;place-items:center;font-family:Fredoka;flex:none}
.o0{background:var(--red)}.o1{background:var(--blue)}.o2{background:var(--green)}.o3{background:var(--purple)}
.opt.right{background:var(--green)!important;outline:4px solid #fff;animation:bounce .5s}
.opt.wrong{background:#999!important;opacity:.7;animation:shake .4s}
.opts.done .opt{pointer-events:none}.opts.done .opt:not(.right):not(.wrong){opacity:.45}
@keyframes bounce{40%{transform:scale(1.04)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{display:none;margin-top:14px;border-radius:16px;padding:12px 14px;background:#fff4d6;color:var(--navy)}
.fb.on{display:block;animation:pop .3s}
.fb b{font-family:Fredoka;font-size:1.15rem;display:block}
.end{text-align:center}
.end img{width:100%;max-width:360px;border-radius:22px;border:4px solid var(--gold)}
.medal{font-size:4rem;margin:8px 0}
.big2{font-size:3rem;color:var(--gold)}
.row{display:flex;gap:10px}.row .big{flex:1}
.ghost{background:#ffffff26;color:#fff;box-shadow:0 6px 0 #0004}
canvas{position:fixed;inset:0;pointer-events:none;z-index:5}
.foot{text-align:center;opacity:.6;font-size:.8rem;margin-top:26px}
.streak{color:#ffd27a;font-family:Fredoka}
</style></head><body>

const cv=$('cv'),cx=cv.getContext('2d');let P=[],run=false;

function tick(){cx.clearRect(0,0,cv.width,cv.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore()});P=P.filter(p=>p.y<cv.height+20);if(P.length)requestAnimationFrame(tick);else{run=false;cx.clearRect(0,0,cv.width,cv.height)}}
